<div class="card">
    <div class="card-header">
        <h2 class="m-0 text-primary">{{isinEditMode?'UPDATE TODO':'ADD TODO'}}</h2>
    </div>
    <div class="card-body">
        <form #todoform="ngForm" (ngSubmit)="onAddTodo()">
            <div class="form-group">
                <label for="todoitem"><strong>TODO ITEM :-</strong></label>
                <input 
                required
                ngModel
                name="todoitem"
                type="text" class="form-control">
            </div>
            <p
            *ngIf="Invalid && todoform.invalid"
            ><strong class="text-danger">PLEASE ENTER VALID DETAIL!!!</strong></p>

            <div>
                <button 
                *ngIf="!isinEditMode"
                mat-raised-button color="primary" class="btn-block">ADD TODO</button>

                <button 
                *ngIf="isinEditMode"
                (click)="onupdate()"
                mat-raised-button color="accent" class="btn-block">UPDATE TODO</button>
            </div>
        </form>
    </div>
</div>
